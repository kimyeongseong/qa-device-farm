<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QA Device Farm</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: rgba(20, 20, 23, 0.4);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #f4f4f5;
            --text-secondary: #a1a1aa;
            --accent-color: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.6);
            --success-color: #10b981;
            --cyan-glow: rgba(6, 182, 212, 0.5);
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Inter', 'Pretendard', 'Malgun Gothic', sans-serif;
            /* Added Korean fonts */
            margin: 0;
            padding: 40px;
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: scroll;
            cursor: default;
        }

        /* Canvas Background */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: radial-gradient(circle at center, #0B0B0E 0%, #000 100%);
        }

        /* Cursor Glow Follower */
        #cursor-glow {
            position: fixed;
            width: 800px;
            height: 800px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.08) 0%, transparent 60%);
            pointer-events: none;
            z-index: -1;
            transform: translate(-50%, -50%);
            transition: opacity 0.3s;
            mix-blend-mode: screen;
        }

        .tech-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 50px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            backdrop-filter: blur(5px);
            position: relative;
            z-index: 10;
        }

        h1 {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 800;
            font-size: 2.5rem;
            margin: 0;
            color: white;
            letter-spacing: -2px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
        }

        .cursor-blink {
            display: inline-block;
            width: 15px;
            height: 35px;
            background: var(--accent-color);
            margin-left: 10px;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        .system-status {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            color: var(--success-color);
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(16, 185, 129, 0.05);
            padding: 8px 16px;
            border-radius: 4px;
            border: 1px solid rgba(16, 185, 129, 0.2);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.1);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--success-color);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--success-color);
            animation: pulseDot 2s infinite;
        }

        /* The header used to read "시스템 정상 가동" as fixed text, so it stayed
           green while adb was down. These states come from /api/health. */
        .system-status.warn {
            color: #ff9f43;
            background: rgba(255, 159, 67, 0.06);
            border-color: rgba(255, 159, 67, 0.3);
            box-shadow: 0 0 15px rgba(255, 159, 67, 0.08);
        }

        .system-status.warn .status-dot {
            background: #ff9f43;
            box-shadow: 0 0 10px #ff9f43;
        }

        .system-status.down {
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.06);
            border-color: rgba(255, 107, 107, 0.35);
            box-shadow: 0 0 15px rgba(255, 107, 107, 0.1);
        }

        .system-status.down .status-dot {
            background: #ff6b6b;
            box-shadow: 0 0 10px #ff6b6b;
        }

        @keyframes pulseDot {
            0% {
                opacity: 1;
                box-shadow: 0 0 5px var(--success-color);
            }

            50% {
                opacity: 0.5;
                box-shadow: 0 0 20px var(--success-color);
            }

            100% {
                opacity: 1;
                box-shadow: 0 0 5px var(--success-color);
            }
        }

        .device-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
            z-index: 1;
            position: relative;
        }

        .device-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            backdrop-filter: blur(16px);
            overflow: hidden;
        }

        .device-card.batch-selected {
            border-color: var(--accent);
            box-shadow: 0 0 0 1px var(--accent);
        }

        .batch-check {
            position: absolute;
            top: 5px;
            right: 5px;
            z-index: 11;
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--accent);
        }

        /* Sticky action bar, hidden until something is selected */
        #batch-bar {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 500;
            padding: 12px 24px;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            background: rgba(10, 10, 12, 0.94);
            border-top: 1px solid var(--accent);
            backdrop-filter: blur(12px);
        }

        #batch-bar.visible {
            display: flex;
        }

        .log-line {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75em;
            white-space: pre-wrap;
            word-break: break-all;
            line-height: 1.5;
            color: #bbb;
        }

        .log-line.crash {
            color: #ff6b6b;
            font-weight: 700;
        }

        .device-card::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.1);
            opacity: 0;
            pointer-events: none;
        }

        .device-card:hover::after {
            animation: scanline 2s linear infinite;
            opacity: 1;
        }

        @keyframes scanline {
            0% {
                top: -10%;
            }

            100% {
                top: 110%;
            }
        }

        .device-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 40px -5px rgba(0, 0, 0, 0.8), 0 0 30px rgba(99, 102, 241, 0.15);
            border-color: rgba(99, 102, 241, 0.5);
        }

        .device-thumb {
            width: 100%;
            height: 380px;
            object-fit: contain;
            background: #000;
            border-radius: 8px;
            margin-bottom: 20px;
            cursor: pointer;
            transition: opacity 0.3s;
            border: 1px solid #222;
        }

        .card-header {
            font-family: 'JetBrains Mono', 'Malgun Gothic', monospace;
            font-size: 1.3rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 5px;
            letter-spacing: -0.5px;
        }

        .btn {
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.2s;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0;
            /* Reduced for Korean */
            font-family: 'JetBrains Mono', 'Malgun Gothic', monospace;
            position: relative;
            overflow: hidden;
        }

        .btn-manage {
            background: #0f0f11;
            color: #fff;
            padding: 16px;
            width: 100%;
            margin-top: 20px;
            border: 1px solid #333;
            z-index: 1;
        }

        .btn-manage::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: 0.5s;
            z-index: -1;
        }

        .btn-manage:hover::before {
            left: 100%;
        }

        .btn-manage:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
            box-shadow: 0 0 15px var(--accent-glow);
            text-shadow: 2px 0 var(--danger-color), -2px 0 var(--cyan-glow);
        }

        .btn-delete {
            background: transparent;
            color: #ef4444;
            padding: 4px 10px;
            font-size: 0.75rem;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .btn-delete:hover {
            background: rgba(239, 68, 68, 0.1);
            border-color: #ef4444;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(20px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal {
            background: #08080a;
            padding: 30px;
            border-radius: 12px;
            width: 600px;
            border: 1px solid #333;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: #555;
            padding: 10px 20px;
            cursor: pointer;
            border-bottom: 2px solid #222;
            font-weight: 700;
            font-family: 'JetBrains Mono', 'Malgun Gothic';
            transition: 0.3s;
        }

        .tab-btn.active {
            color: #fff;
            border-bottom-color: var(--accent-color);
            text-shadow: 0 0 10px var(--accent-color);
        }

        .tab-content {
            display: none;
            padding-top: 20px;
            height: 500px;
            overflow-y: auto;
        }

        .tab-content.active {
            display: block;
        }

        .pkg-item {
            padding: 8px;
            border-bottom: 1px solid #222;
            color: #aaa;
            font-family: 'JetBrains Mono', 'Malgun Gothic';
            font-size: 0.85em;
            display: flex;
            justify-content: space-between;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: #000;
        }

        ::-webkit-scrollbar-thumb {
            background: #333;
        }
    </style>
</head>

<body>
    <!-- Background FX -->
    <canvas id="bg-canvas"></canvas>
    <div id="cursor-glow"></div>

    <div class="tech-header">
        <div>
            <h1 id="mainTitle">QA DEVICE FARM <div class="cursor-blink"></div>
            </h1>
            <div style="font-size:0.8em; color:#666; font-family:'JetBrains Mono'; margin-top:5px; letter-spacing:1px;">
                MANAGED BY QA TEAM</div>
        </div>
        <div class="system-status" id="farm-status" title="">
            <div class="status-dot" id="status-dot"></div>
            <span id="status-text">상태 확인 중…</span>
        </div>
    </div>

    <!-- Details Modal -->
    <div id="manageModal" class="modal-overlay">
        <div class="modal">
            <span class="close-btn" style="float:right; cursor:pointer; color:#fff; font-size:1.5em;"
                onclick="closeModal()">×</span>
            <h2 id="modalTitle" style="color:white; margin-top:0; font-family:'JetBrains Mono';">설정</h2>
            <div style="display:flex; gap:0; margin-bottom:20px;">
                <button class="tab-btn active" onclick="switchTab('info')" id="tab-info">시스템 정보</button>
                <button class="tab-btn" onclick="switchTab('apps')" id="tab-apps">앱 관리</button>
                <button class="tab-btn" onclick="switchTab('macros')" id="tab-macros">매크로</button>
                <button class="tab-btn" onclick="switchTab('logcat')" id="tab-logcat">로그</button>
            </div>
            <div id="info-content" class="tab-content active"></div>
            <div id="apps-content" class="tab-content"></div>
            <div id="macros-content" class="tab-content"></div>
            <div id="logcat-content" class="tab-content"></div>
        </div>
    </div>

    <!-- Batch action bar: appears once at least one device is checked -->
    <div id="batch-bar">
        <span id="batch-count" style="font-family:'JetBrains Mono'; color:var(--accent);"></span>
        <button class="btn btn-manage" style="width:auto;" onclick="batchMacroPrompt()">▶ 매크로 일괄 실행</button>
        <button class="btn btn-manage" style="width:auto;" onclick="batchAppPrompt('launch')">앱 실행</button>
        <button class="btn btn-manage" style="width:auto;" onclick="batchAppPrompt('stop')">앱 종료</button>
        <button class="btn btn-manage" style="width:auto;" onclick="batchAppPrompt('clear')">데이터 초기화</button>
        <button class="btn btn-manage" style="width:auto;" onclick="document.getElementById('batch-apk').click()">APK 일괄 설치</button>
        <input type="file" id="batch-apk" accept=".apk" style="display:none" onchange="batchInstall(this)">
        <button class="btn btn-delete" style="width:auto;" onclick="clearBatch()">선택 해제</button>
    </div>

    <div class="device-grid" id="device-container">
        <!-- Devices injected here -->
        <div class="empty-msg"
            style="grid-column: 1/-1; text-align: center; padding: 100px; color: #333; font-family:'JetBrains Mono';">
            [ 기기 연결 대기 중... ]
        </div>
    </div>

    <script>
        // --- ADVANCED FX SYSTEM ---
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        const glow = document.getElementById('cursor-glow');

        let width, height;
        let particles = [];
        let ripples = [];
        let mouse = { x: -9999, y: -9999 };

        // Hacking Text Effect (Modified for Branding)
        const titleElement = document.getElementById('mainTitle');
        const finalTitle = "QA DEVICE FARM";
        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*";

        function hackTextEffect() {
            let iterations = 0;
            const interval = setInterval(() => {
                titleElement.innerText = finalTitle.split("").map((letter, index) => {
                    if (index < iterations) return letter;
                    return chars[Math.floor(Math.random() * chars.length)];
                }).join("");

                titleElement.innerHTML += ' <div class="cursor-blink"></div>';

                if (iterations >= finalTitle.length) clearInterval(interval);
                iterations += 1 / 2;
            }, 30);
        }
        window.onload = hackTextEffect;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initParticles();
        }
        window.addEventListener('resize', resize);

        document.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            glow.style.left = e.clientX + 'px';
            glow.style.top = e.clientY + 'px';
        });

        document.addEventListener('mousedown', (e) => {
            ripples.push({
                x: e.clientX, y: e.clientY,
                radius: 0, opacity: 1,
                color: 'rgba(99, 102, 241, '
            });
        });

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.8;
                this.vy = (Math.random() - 0.5) * 0.8;
                this.size = Math.random() * 2 + 0.5;
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;

                const dx = mouse.x - this.x;
                const dy = mouse.y - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < 200) {
                    ctx.beginPath();
                    ctx.strokeStyle = `rgba(100, 200, 255, ${1 - dist / 200})`;
                    ctx.lineWidth = 0.5;
                    ctx.moveTo(this.x, this.y);
                    ctx.lineTo(mouse.x, mouse.y);
                    ctx.stroke();
                }
            }
            draw() {
                ctx.beginPath();
                ctx.fillStyle = 'rgba(255,255,255,0.4)';
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            const count = Math.floor(width * height / 12000);
            for (let i = 0; i < count; i++) particles.push(new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => { p.update(); p.draw(); });
            ripples.forEach((r, index) => {
                r.radius += 5;
                r.opacity -= 0.02;
                ctx.beginPath();
                ctx.strokeStyle = r.color + r.opacity + ')';
                ctx.lineWidth = 2;
                ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
                ctx.stroke();
                if (r.opacity <= 0) ripples.splice(index, 1);
            });
            requestAnimationFrame(animate);
        }
        resize();
        animate();


        // --- LOGIC SYSTEM ---
        let currentSerial = '';
        async function fetchDevices() {
            try {
                const res = await apiFetch('/api/devices');
                const data = await res.json();
                if (data.devices) renderDevices(data.devices);
            } catch (e) {
                console.error(e);
            }
        }

        // An <img src> cannot carry the token header, so fetch the frame and hand
        // the element a blob. Putting ?token= on the URL would work too, but this
        // poll runs every two seconds -- the secret would end up in every access
        // log line and in browser history.
        async function refreshThumb(img, serial) {
            if (!img) return;
            try {
                const res = await apiFetch(`/api/device/${serial}/screenshot?t=${Date.now()}`);
                if (!res.ok) return;            // 503 while the device is busy: next poll retries
                const url = URL.createObjectURL(await res.blob());
                const previous = img.dataset.blobUrl;
                img.src = url;
                img.dataset.blobUrl = url;
                if (previous) URL.revokeObjectURL(previous);
            } catch (e) {
                /* transient; the next poll tries again */
            }
        }

        // Who currently holds the device, and for how much longer. An attached
        // but unusable device says why instead of pretending to be idle.
        function leaseBadge(dev) {
            if (dev.state && dev.state !== 'device') {
                return `<span style="color:#ff9f43;" title="${dev.state}">⚠ ${dev.state_hint || dev.state}</span>`;
            }
            if (!dev.occupied_by) {
                return `<span style="color:var(--success-color);">● IDLE</span>`;
            }
            const left = Math.max(0, Math.round((dev.occupied_until - Date.now() / 1000) / 60));
            return `<span style="color:#ffb454;" title="점유 중">🔒 ${dev.occupied_by} <span style="color:#666;">${left}m</span></span>`;
        }

        const isUsable = dev => !dev.state || dev.state === 'device';

        function renderDevices(devices) {
            const container = document.getElementById('device-container');
            const currentSerials = new Set(devices.map(d => d.serial));

            document.querySelectorAll('.device-card').forEach(card => {
                const serial = card.id.replace('card-', '');
                if (!currentSerials.has(serial)) {
                    // A device that unplugged should not stay in the batch selection.
                    card.remove();
                    if (batchSelected.delete(serial)) renderBatchBar();
                }
            });

            if (devices.length === 0 && container.children.length === 0) {
                container.innerHTML = `<div class='empty-msg' style='grid-column:1/-1; text-align:center; padding:50px; color:#555;'>[ 시스템 스캔 중... USB 연결을 확인하세요 ]</div>`;
                return;
            } else {
                const e = container.querySelector('.empty-msg');
                if (e) e.remove();
            }

            devices.forEach((dev, index) => {
                let card = document.getElementById(`card-${dev.serial}`);

                // Audio State
                const isAudio = window[`audio_${dev.serial}`];
                const audioColor = isAudio ? 'var(--danger-color)' : '#444'; // Grey when off, Red when on (stop)
                const audioText = isAudio ? '🔇 STOP' : '🔊 SOUND';

                // Alias Logic
                const displayName = (dev.alias && dev.alias !== dev.model) ? `${dev.alias} <span style='font-size:0.7em; color:#666;'>(${dev.model})</span>` : dev.model;

                if (card) {
                    // An unusable device has no screen to poll; leave its
                    // placeholder alone rather than hammering a failing endpoint.
                    const img = card.querySelector('.device-thumb');
                    if (img && isUsable(dev)) refreshThumb(img, dev.serial);
                    const battery = card.querySelector('.battery-info');
                    if (battery) battery.innerText = `${dev.battery || '?'}`;
                    const lease = card.querySelector('.lease-info');
                    if (lease) lease.innerHTML = leaseBadge(dev);

                    // Update Title
                    const header = card.querySelector('.card-header');
                    if (header) header.innerHTML = `${displayName} <span onclick="editAlias('${dev.serial}', '${dev.alias || dev.model}')" style="cursor:pointer; font-size:0.8em; margin-left:5px;">✏️</span>`;

                    // Update Audio Button
                    const audioBtn = card.querySelector('.btn-audio');
                    if (audioBtn) {
                        audioBtn.style.color = isAudio ? '#ff5555' : '#888';
                        audioBtn.innerText = audioText;
                        audioBtn.style.borderColor = isAudio ? '#ff5555' : '#333';
                    }

                } else {
                    card = document.createElement('div');
                    card.className = 'device-card' + (batchSelected.has(dev.serial) ? ' batch-selected' : '');
                    card.id = `card-${dev.serial}`;
                    card.setAttribute('ondrop', `dropHandler(event, '${dev.serial}')`);
                    card.setAttribute('ondragover', 'dragOverHandler(event)');
                    // Unusable devices get no screenshot, no batch checkbox and
                    // no controls -- only the reason they cannot be used.
                    const usable = isUsable(dev);
                    const thumb = usable
                        ? `<img class="device-thumb" alt="" onclick="openControl('${dev.serial}', '${dev.model}')">`
                        : `<div class="device-thumb" style="display:flex; align-items:center; justify-content:center; background:#151515; color:#ff9f43; font-size:2.4em;">⚠</div>`;
                    card.innerHTML = `
                         <div style="position:relative;">
                             <div style="position:absolute; top:5px; left:5px; background:rgba(0,0,0,0.7); color:#0f0; padding:2px 6px; font-size:0.8em; border-radius:4px; border:1px solid #0f0; z-index:10;">No.${index + 1}</div>
                             ${usable ? `<input type="checkbox" class="batch-check" title="일괄 작업 대상으로 선택"
                                    ${batchSelected.has(dev.serial) ? 'checked' : ''}
                                    onchange="toggleBatch('${dev.serial}', this.checked)">` : ''}
                             ${thumb}
                        </div>
                        <div class="card-header">
                            ${displayName} <span onclick="editAlias('${dev.serial}', '${dev.alias || dev.model}')" style="cursor:pointer; font-size:0.8em; margin-left:5px;">✏️</span>
                        </div>
                        <div style="display:flex; justify-content:space-between; margin-bottom:8px; font-size:0.9em; color:#888; font-family:'JetBrains Mono';">

            if (newName === null) return; // Cancelled

            try {
                const res = await apiFetch(`/api/alias/${serial}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },

        async function toggleAudio() {

                if (!confirm("PC 스피커로 소리를 재생합니다.\n(작은 오디오 창이 뜹니다. 닫지 마세요!)")) return;

        }
        // --- Access token ---
        // The farm only asks for one when DEVICE_FARM_TOKEN is set on the
        // server. Kept in localStorage so a reload does not re-prompt, and
        // attached to every request through the wrapper below rather than at
        // each call site, so a new endpoint cannot forget it.
        const TOKEN_KEY = 'farmToken';
        function farmToken() { return localStorage.getItem(TOKEN_KEY) || ''; }

        function authHeaders(extra) {
            const h = Object.assign({}, extra || {});
            const t = farmToken();
            if (t) h['X-Farm-Token'] = t;
            return h;
        }

        async function apiFetch(url, options) {
            const opts = Object.assign({}, options || {});
            opts.headers = authHeaders(opts.headers);
            const res = await fetch(url, opts);
            if (res.status === 401) promptForToken();
            return res;
        }

        function promptForToken() {
            const t = prompt('이 팜은 접근 토큰이 필요합니다.\n서버의 DEVICE_FARM_TOKEN 값을 입력하세요.',
                             farmToken());
            if (t === null) return false;
            localStorage.setItem(TOKEN_KEY, t.trim());
            location.reload();
            return true;
        }

        // Small helper so every JSON POST sends the right content type.
        async function postJson(url, body) {
            const res = await apiFetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body || {})
            });
            return { ok: res.ok, data: await res.json().catch(() => ({})) };
        }

        async function loadApps() {
            const div = document.getElementById('apps-content');
            div.innerHTML = '패키지 목록 불러오는 중...';
            const res = await apiFetch(`/api/packages/${currentSerial}`);
            const data = await res.json();
            div.innerHTML = '';
            if (!data.packages || data.packages.length === 0) {
                div.innerHTML = '설치된 서드파티 앱이 없습니다.';
                return;
            }
            data.packages.forEach(p => {
                const r = document.createElement('div');
                r.className = 'pkg-item';
                r.innerHTML = `<span>${p}</span>
                    <div style="display:flex; gap:5px;">
                        <button class="btn btn-delete" style="color:#8ef; border-color:#356;" onclick="appAction('launch','${p}')">실행</button>
                        <button class="btn btn-delete" style="color:#ccc; border-color:#555;" onclick="appAction('stop','${p}')">종료</button>
                        <button class="btn btn-delete" style="color:#fc8; border-color:#653;" onclick="appAction('clear','${p}')">초기화</button>
                        <button class="btn btn-delete" onclick="uninstall('${p}')">삭제</button>
                    </div>`;
                div.appendChild(r);
            });

        const APP_ACTION_LABEL = { launch: '실행', stop: '종료', clear: '데이터 초기화' };
        async function appAction(action, pkg) {
            if (action === 'clear' && !confirm(`${pkg}\n\n앱 데이터를 모두 지웁니다. 계속할까요?`)) return;
            const { ok, data } = await postJson(`/api/app/${currentSerial}/${action}`, { package: pkg });
            if (ok) return;
            // A held device is the common case here, and it needs a different
            // instruction than a generic adb failure.
            if (data.owner) {
                alert(`${APP_ACTION_LABEL[action]} 불가\n\n`
                    + `'${data.owner}' 님이 이 기기를 점유 중입니다.\n`
                    + `테스트 중일 수 있으니 점유가 끝난 뒤 진행하세요.`);
            } else {
                alert(`${APP_ACTION_LABEL[action]} 실패: ${data.message || '알 수 없는 오류'}`);
            }
        }

        async function loadMacros() {

                    ? `${m.events ?? '?'} 스텝 · ${m.width}x${m.height}`

        // --- Logcat ---
        let logPollTimer = null;
        function stopLogPolling() { clearInterval(logPollTimer); logPollTimer = null; }

        async function loadLogcat() {
            const div = document.getElementById('logcat-content');
            div.innerHTML = `
                <div style="display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; align-items:center;">
                    <button class="btn btn-delete" style="color:#8f8; border-color:#363;" onclick="logcatStart()">수집 시작</button>
                    <label style="font-size:0.75em; color:#888; display:flex; align-items:center; gap:4px; cursor:pointer;"
                        title="메모리 버퍼는 2만 줄에서 오래된 로그를 버립니다. 장시간 실행이면 켜세요.">
                        <input type="checkbox" id="log-to-file"> 파일로 저장</label>
                    <button class="btn btn-delete" style="color:#ccc; border-color:#555;" onclick="logcatStop()">중지</button>
                    <button class="btn btn-delete" style="color:#8ef; border-color:#356;" onclick="logcatDownload()">다운로드</button>
                    <input id="log-filter" placeholder="필터 (예: Exception)" oninput="refreshLog()"
                        style="flex:1; min-width:140px; background:#111; border:1px solid #333; color:#ddd; padding:6px; font-family:'JetBrains Mono'; font-size:0.8em;">
                </div>
                <div id="log-summary" style="font-family:'JetBrains Mono'; font-size:0.8em; margin-bottom:8px; color:#888;"></div>
                <div id="log-body" style="max-height:320px; overflow:auto; background:#0a0a0a; border:1px solid #222; padding:10px;"></div>`;
            refreshLog();
            stopLogPolling();
            logPollTimer = setInterval(refreshLog, 2000);
        }

        async function logcatStart() {
            const toFile = !!(document.getElementById('log-to-file') || {}).checked;
            const { ok, data } = await postJson(`/api/logcat/${currentSerial}/start`,
                { clear: true, level: 'V', to_file: toFile });
            if (!ok) { alert('수집 시작 실패: ' + (data.message || '')); return; }
            if (data.file) alert(`파일로도 저장합니다:
${data.file}`);
            refreshLog();
        }
        async function logcatStop() {
            await postJson(`/api/logcat/${currentSerial}/stop`, {});
            refreshLog();
        }
        async function logcatDownload() {
            // Same reason as the thumbnails: window.open cannot send the token.
            const res = await apiFetch(`/api/logcat/${currentSerial}/download`);
            if (!res.ok) { alert('수집 중이 아닙니다.'); return; }
            const url = URL.createObjectURL(await res.blob());
            const a = document.createElement('a');
            a.href = url;
            a.download = `logcat_${currentSerial}.txt`;
            a.click();
            URL.revokeObjectURL(url);
        }

        async function refreshLog() {
            const summary = document.getElementById('log-summary');
            const body = document.getElementById('log-body');
            if (!summary || !body) return;

            const filter = (document.getElementById('log-filter') || {}).value || '';
            const qs = filter ? `?tail=300&contains=${encodeURIComponent(filter)}` : '?tail=300';
            const res = await apiFetch(`/api/logcat/${currentSerial}${qs}`);

            if (!res.ok) {
                summary.innerHTML = `<span style="color:#666;">수집 중이 아닙니다. [수집 시작]을 누르세요.</span>`;
                body.innerHTML = '';
                return;
            }

            const d = await res.json();
            const crashNote = d.crashes.length
                ? `<span style="color:#ff6b6b; font-weight:700;">크래시 ${d.crashes.length}건</span>`
                : `<span style="color:var(--success-color);">크래시 없음</span>`;
            const fileNote = d.file ? ` · <span style="color:#8ef;" title="${d.file}">파일 저장 중</span>` : '';
            summary.innerHTML = `● 수집 중 · ${d.total}줄${filter ? ` (필터 일치 ${d.matched})` : ''} · ${crashNote}${fileNote}`;

            // Only the tail is rendered; the full buffer is what the download gives you.
            const atBottom = body.scrollTop + body.clientHeight >= body.scrollHeight - 40;
            body.innerHTML = d.lines
                .map(l => `<div class="log-line${/FATAL EXCEPTION|ANR in |Fatal signal/.test(l) ? ' crash' : ''}">${escapeHtml(l)}</div>`)
                .join('');
            if (atBottom) body.scrollTop = body.scrollHeight;
        }

        function escapeHtml(s) {
            return s.replace(/[&<>"']/g, ch => (
                { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]
            ));
        }

        // --- Batch selection ---
        const batchSelected = new Set();

        function toggleBatch(serial, checked) {
            checked ? batchSelected.add(serial) : batchSelected.delete(serial);
            const card = document.getElementById(`card-${serial}`);
            if (card) card.classList.toggle('batch-selected', checked);
            renderBatchBar();
        }

        function clearBatch() {
            batchSelected.clear();
            document.querySelectorAll('.batch-check').forEach(cb => cb.checked = false);
            document.querySelectorAll('.device-card').forEach(c => c.classList.remove('batch-selected'));
            renderBatchBar();
        }

        function renderBatchBar() {
            const bar = document.getElementById('batch-bar');
            bar.classList.toggle('visible', batchSelected.size > 0);
            document.getElementById('batch-count').innerText = `${batchSelected.size}대 선택됨`;
        }

        // Every batch call reports per-device results. Separate "someone else has
        // it" from "it broke" -- they need different reactions from the operator.
        function reportBatch(title, data) {
            if (!data || !data.results) { alert(`${title} 실패: ${(data && data.message) || '알 수 없는 오류'}`); return; }
            const failed = data.results.filter(r => r.status === 'error');
            const skipped = data.results.filter(r => r.status === 'skipped');
            if (!failed.length && !skipped.length) { alert(`${title}: ${data.succeeded}대 모두 성공`); return; }

            const lines = [`${title}: 성공 ${data.succeeded} / 실패 ${data.failed} / 점유중 건너뜀 ${data.skipped || 0}`, ''];
            skipped.forEach(s => lines.push(`· ${s.serial}: ${s.message} — 점유 해제 후 재시도하세요`));
            failed.forEach(f => lines.push(`· ${f.serial}: ${f.message}`));
            alert(lines.join('\n'));
        }

        async function batchAppPrompt(action) {
            const pkg = prompt(`패키지명을 입력하세요 (${APP_ACTION_LABEL[action]})`, 'com.example.app');
            if (!pkg) return;
            const { data } = await postJson('/api/batch/app',
                { serials: [...batchSelected], action, package: pkg.trim() });
            reportBatch(`일괄 ${APP_ACTION_LABEL[action]}`, data);
        }

        async function batchMacroPrompt() {
            const res = await apiFetch('/api/macros');
            const names = (await res.json()).macros || [];
            if (!names.length) { alert('저장된 매크로가 없습니다.'); return; }
            const name = prompt(`실행할 매크로 이름:\n\n${names.join('\n')}`, names[0]);
            if (!name) return;
            const count = parseInt(prompt('반복 횟수', '1'), 10) || 1;
            const { data } = await postJson('/api/batch/macro',
                { serials: [...batchSelected], name: name.trim(), count });
            reportBatch('일괄 매크로 실행', data);
        }

        async function batchInstall(input) {
            const file = input.files[0];
            input.value = '';
            if (!file) return;
            const targets = [...batchSelected];
            if (!confirm(`${file.name}\n\n${targets.length}대에 설치합니다. 계속할까요?`)) return;

            const fd = new FormData();
            fd.append('file', file);
            fd.append('serials', targets.join(','));
            const res = await apiFetch('/api/batch/install', { method: 'POST', body: fd });
            reportBatch('일괄 APK 설치', await res.json().catch(() => null));
        }

        async function uninstall(pkg) { if (!confirm(pkg + ' 앱을 삭제하시겠습니까?')) return; await postJson(`/api/uninstall/${currentSerial}`, { package: pkg }); loadApps(); }
        async function playMacro(name) { if (!confirm(name + ' 매크로를 실행하시겠습니까?')) return; await postJson(`/api/macros/play/${currentSerial}`, { name: name }); }
        async function toggleWireless() { await apiFetch(`/api/wireless/${currentSerial}`, { method: 'POST' }); alert('무선 연결 명령을 전송했습니다. 케이블 분리 전 로그를 확인하세요.'); }
        function dragOverHandler(ev) { ev.preventDefault(); ev.dataTransfer.dropEffect = "copy"; }
        function dropHandler(ev, serial) { ev.preventDefault(); if (ev.dataTransfer.items) { [...ev.dataTransfer.items].forEach((item) => { if (item.kind === 'file') { const file = item.getAsFile(); if (file.name.endsWith('.apk')) uploadApk(file, serial); } }); } }
        async function uploadApk(file, serial) { alert(file.name + ' 설치를 시작합니다...'); const fd = new FormData(); fd.append('file', file); await apiFetch(`/api/install/${serial}`, { method: 'POST', body: fd }); alert('설치가 완료되었습니다.'); }

        // Farm health in the header. This replaces a hardcoded "시스템 정상 가동",
        // which stayed green even with adb unreachable -- a status light that is
        // always on is worse than none. Polled slower than the device grid
        // because none of it changes second to second.
        async function refreshFarmStatus() {
            const box = document.getElementById('farm-status');
            const dot = document.getElementById('status-dot');
            const text = document.getElementById('status-text');
            if (!box) return;

            let h;
            try {
                const res = await apiFetch('/api/health');
                h = await res.json();
            } catch (e) {
                box.className = 'system-status down';
                text.textContent = '서버에 연결할 수 없음';
                box.title = '대시보드가 팜 서버에 닿지 못합니다.';
                return;
            }

            if (h.adb !== 'ok') {
                box.className = 'system-status down';
                text.textContent = 'adb 연결 불가';
                box.title = h.message || 'adb 서버에 접속할 수 없습니다.';
                return;
            }

            // adb 서버에는 닿는데 실행 파일이 없는 상태. 기기 목록과 썸네일은
            // 그대로 나오므로, 명시하지 않으면 정상으로 보인다.
            if (h.adb_binary && h.adb_binary.ok === false) {
                box.className = 'system-status down';
                text.textContent = `기기 ${h.devices_total}대 · adb 실행 파일 없음`;
                box.title = h.adb_binary.note || `${h.adb_binary.path} 를 찾을 수 없습니다.`;
                return;
            }

            const notes = [];
            if (h.devices_unusable) {
                notes.push(`사용 불가 ${h.devices_unusable}대`);
            }
            const server = h.adb_server || {};
            if (server.note) notes.push('adb 서버 버전 낮음');

            box.className = 'system-status' + (notes.length ? ' warn' : '');
            text.textContent = `기기 ${h.devices_total}대 · 유휴 ${h.devices_free}`
                + (notes.length ? ' · ' + notes.join(' · ') : '');

            const tips = [`adb: ${h.adb_path}`, `adb 서버 버전: ${server.version ?? '알 수 없음'}`];
            if (server.note) tips.push(server.note);
            if (h.devices_unusable) {
                tips.push('사용 불가: ' + Object.entries(h.unusable || {})
                    .map(([s, st]) => `${s} (${st})`).join(', '));
            }
            box.title = tips.join('\n');
        }

        fetchDevices();
        setInterval(fetchDevices, 2000);
        refreshFarmStatus();
        setInterval(refreshFarmStatus, 5000);
    </script>
</body>

</html>
