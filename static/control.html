<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device Controller</title>
    <!-- Bundled locally: a device farm often sits on an isolated test network -->
    <script type="text/javascript" src="/static/jmuxer.min.js"></script>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', sans-serif;
        }

        #header {
            width: 100%;
            padding: 10px 20px;
            background: #1e1e1e;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #video-container {
            margin-top: 20px;
            border: 2px solid #333;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            line-height: 0;
            /* Removing bottom gap */
        }

        video {
            background: #000;
            max-height: 80vh;
            max-width: 100%;
        }

        .btn {
            background: #bb86fc;
            color: #000;
            border: none;
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div id="header">
        <span id="device-id">Connecting...</span>
        <div>
            <button id="btn-record" class="btn" style="background:#cf6679; margin-right:10px;"
                onclick="toggleRecord()">🔴 Rec</button>
            <button class="btn" onclick="location.href='/'">Go Back</button>
        </div>
    </div>

    <div id="video-container">
        <video id="player" autoplay muted></video>
    </div>

    <script>
        // The dashboard stores the farm token in localStorage; this page is
        // opened from it and shares the origin, so it reuses it.
        function authHeaders(extra) {
            const h = Object.assign({}, extra || {});
            const t = localStorage.getItem('farmToken') || '';
            if (t) h['X-Farm-Token'] = t;
            return h;
        }
        function apiFetch(url, options) {
            const opts = Object.assign({}, options || {});
            opts.headers = authHeaders(opts.headers);
            return fetch(url, opts);
        }
        // WebSockets cannot carry headers from a browser, so the token rides in
        // the query string. Same origin only.
        function wsUrlWithToken(path) {
            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            const t = localStorage.getItem('farmToken') || '';
            return `${proto}//${location.host}${path}` + (t ? `?token=${encodeURIComponent(t)}` : '');
        }

        const urlParams = new URLSearchParams(window.location.search);
        const serial = urlParams.get('serial');
        const model = urlParams.get('model');
        document.title = `${model} [${serial}]`;
        document.getElementById('device-id').textContent = `Device: ${serial}`;

        // Initialize JMuxer
        const jmuxer = new JMuxer({
            node: 'player',
            mode: 'video',
            flushingTime: 0,
            fps: 60,
            debug: false
        });

        // `screenrecord` only emits frames when the screen changes, and a device
        // sitting idle is the normal state while you watch a test wait. The buffer
        // then runs dry, the element pauses, and it does *not* resume by itself
        // when frames come back -- so the mirror stayed frozen until a reload,
        // even though data was arriving. Measured on a TB373FU: ready=4 with a
        // growing buffer and paused=true at the same time.
        // Polled rather than event-driven on purpose: once the element pauses with
        // readyState already at HAVE_ENOUGH_DATA, no further 'canplay' fires, so a
        // listener never gets the chance to restart it. Verified on a TB373FU --
        // six seconds after a pause the only event seen was 'pause' itself.
        const player = document.getElementById('player');
        setInterval(() => {
            const buffered = player.buffered;
            if (!buffered.length) {
                return;
            }
            // Snap to the newest frame whenever the playhead leaves the buffered
            // range -- in *either* direction. Behind means the screen was idle and
            // a backlog built up; ahead happens because jmuxer advances the timeline
            // at the configured 60fps while `screenrecord` delivers far fewer frames
            // than that, so the playhead outruns the data and the element will not
            // resume at all. Measured on a TB373FU: currentTime 35.49 against a
            // buffered end of 23.31, permanently stuck.
            const live = buffered.end(buffered.length - 1);
            if (player.currentTime > live || live - player.currentTime > 1) {
                player.currentTime = Math.max(0, live - 0.1);
            }
            if (player.paused) {
                player.play().catch(() => { /* autoplay blocked; the user can hit play */ });
            }
        }, 1000);

        // Connect to Python Server Video WebSocket
        const ws = new WebSocket(wsUrlWithToken(`/ws/video/${serial}`));

        ws.binaryType = 'arraybuffer';

        ws.onopen = () => {
            console.log('Video WS Connected');
        };

        ws.onmessage = (event) => {
            jmuxer.feed({
                video: new Uint8Array(event.data)
            });
        };

        ws.onerror = (e) => console.error('WS Error:', e);

        // --- Control Logic ---
        const controlWs = new WebSocket(wsUrlWithToken(`/ws/control/${serial}`));

        const videoElement = document.getElementById('player');

        // Mouse Events
        videoElement.addEventListener('mousedown', (e) => {
            const rect = videoElement.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const scaleX = videoElement.videoWidth / videoElement.offsetWidth;
            const scaleY = videoElement.videoHeight / videoElement.offsetHeight;

            controlWs.send(JSON.stringify({
                type: 'tap',
                x: Math.round(x * scaleX),
                y: Math.round(y * scaleY)
            }));
        });

        // --- Macro Functions ---
        let isRecording = false;
        async function toggleRecord() {
            const btn = document.getElementById('btn-record');
            if (!isRecording) {
                if (!confirm("Start Recording?")) return;
                await apiFetch(`/api/macros/start_record/${serial}`, { method: 'POST' });
                isRecording = true;
                btn.innerText = "⏹ Stop";
                btn.style.background = "#ff0000";
            } else {
                const name = prompt("Macro Name:") || `macro_${Date.now()}`;
                const res = await apiFetch(`/api/macros/stop_record/${serial}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: name })
                });
                const data = await res.json();
                alert(`Saved: ${name}`);
                isRecording = false;
                btn.innerText = "🔴 Rec";
                btn.style.background = "#cf6679";
            }
        }
    </script>
</body>

</html>
